<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="NGscript.js" defer></script>
    <link rel="stylesheet" href="NGstyle.css">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Number Guessing Game</h1>
        <p>Guess a number between 1 and 50</p>
    </div>
    <form>
        <input id="enterGuess" class="enterGuess" type="number" placeholder="Enter Your Guess">
        <button id="submitGuess" class="submitGuess" type="submit">Submit Guess</button>
    </form>

    <button type="button" id="restart">Restart Game</button>

    <small id="error" class="error"></small>
    <small id="attempts" class="attempts"></small>

    
</body>
</html>
