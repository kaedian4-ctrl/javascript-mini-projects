<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="RAPscript.js" defer></script>
    <link rel="stylesheet"  href="RAPstyle.css">
    <title>Random Activity Picker</title>
</head>
<body>
    <main class="picker">
        <h1>What should I do?</h1>
        <p class="intro">Let chance pick your next activity.</p>

        <section class="pickSection" aria-live="polite">
            <p id="activityResult" class="activityResult">Your activity will appear here</p>
            <button type="button" id="pickActivity" class="primaryButton">Pick an activity</button>
        </section>

        <form id="activityForm" class="addForm">
            <label for="activityInput">Add your own activity</label>
            <div class="inputRow">
                <input id="activityInput" type="text" placeholder="e.g. Read a book">
                <button type="button" id="addActivity" class="secondaryButton">Add</button>
            </div>
        </form>

        <section class="activitySection">
            <div class="listHeading">
                <h2>Your activities</h2>
                <p><span id="activityCount">0</span> activities</p>
            </div>
            <ul id="activityList" class="activityList"></ul>
        </section>
    </main>
</body>
</html>
